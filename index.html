<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SEC+ 801 // Neon Defense — a Security+ SY0-801 study game built for Meta Ray-Ban Display glasses and Neural Band.">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>SEC+ 801 // Neon Defense</title>
<style>
  /* Built for Meta Ray-Ban Display: 600x600 additive display (black = transparent),
     no scrolling, everything reachable with swipe (arrow keys) + pinch (Enter). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body {
    display: flex; align-items: center; justify-content: center;
    color: #d6faff; font-family: "Courier New", ui-monospace, monospace;
  }
  #app {
    width: min(600px, 100vw); height: min(600px, 100vh); position: relative; overflow: hidden;
    padding: 14px; display: flex; flex-direction: column;
  }
  .hud { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #0ff; letter-spacing: .1em; text-transform: uppercase; gap: 8px; }
  h1 { font-size: 24px; margin: 8px 0 4px; color: #0ff; text-shadow: 0 0 8px #0ff; letter-spacing: .04em; }
  h2 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 6px 0; line-height: 1.4; font-size: 18px; }
  .tiny { font-size: 14px; color: #9fe; }
  button { font: inherit; }
  .btn {
    background: #000; border: 2px solid #0ff; color: #0ff; padding: 10px 14px;
    cursor: pointer; border-radius: 6px; text-transform: uppercase; letter-spacing: .06em; font-size: 15px;
  }
  .btn.good { border-color: #39ff14; color: #39ff14; }
  .btn.bad { border-color: #ff2bd6; color: #ff2bd6; }
  /* Strong, always-visible focus ring: this is the "cursor" on the glasses */
  button:focus, button:focus-visible {
    outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 14px #fff8;
  }
  button:disabled { cursor: default; }
  .card { border: 2px solid #0ff6; background: #000; padding: 12px 14px; border-radius: 8px; margin-top: 8px; }
  .bar { height: 8px; background: #0ff3; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #0ff, #f0f); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    text-align: left; background: #000; border: 2px solid; padding: 14px; cursor: pointer;
    color: #d6faff; border-radius: 8px; min-height: 96px;
  }
  .tile b { display: block; font-size: 18px; }
  .tile small { color: #9fe; font-size: 14px; }
  .cell {
    display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 8px 10px; font-size: 15px; line-height: 1.25;
    background: #000; border: 2px solid #0ff6; color: #d6faff; cursor: pointer; border-radius: 6px; min-height: 56px;
  }
  .cell.sel { border-color: #ffe600; color: #ffe600; }
  .cell.good { border-color: #39ff1466; color: #39ff1499; }
  .viz-wrap { display: flex; justify-content: center; }
  .viz { height: 160px; width: auto; max-width: 100%; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
  .choice { display: block; width: 100%; text-align: left; margin-bottom: 8px; text-transform: none; font-size: 17px; }
  /* Home sector map */
  .map { position: relative; flex: 1; margin-top: 4px; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node {
    position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
    background: #000; border: 3px solid; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 0; line-height: 1.1;
  }
  .node b { font-size: 22px; }
  .node span { font-size: 13px; color: #9ff; }
  .node em { font-style: normal; font-size: 12px; }
  .node:focus { outline-offset: 4px; }
  .core {
    position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px;
    border-radius: 50%; border: 2px solid #0ff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #0ff; font-weight: bold; font-size: 18px; pointer-events: none; background: #000;
  }
  .core small { font-size: 12px; color: #9ff; font-weight: normal; }
</style>
</head>
<body>
<main id="app" aria-label="Security+ SY0-801 neon trainer"></main>

<script>
const D = [
  { name: "General Security Concepts", s: "GSC", w: 16, c: "#00f0ff",
    nodes: [
      ["CIA triad", "Confidentiality keeps data secret, integrity keeps it unaltered, availability keeps systems running. Most controls map to one of these."],
      ["Control types", "Categories: technical, managerial, operational, physical. Functions: preventive, detective, corrective, deterrent, compensating."],
      ["Cryptography", "Symmetric encryption uses one shared key and is fast. Asymmetric uses a public and private key pair for signatures and key exchange. Hashes are one-way."],
      ["Change management", "Changes are reviewed, tested, approved, and have a rollback plan before they reach production."]
    ],
    pairs: [["Confidentiality", "Only authorized people can read the data"], ["Integrity", "Data has not been changed without approval"], ["Availability", "Systems and data are reachable when needed"], ["Non-repudiation", "The sender cannot credibly deny sending it"]],
    scen: { q: "Files on a file server were changed without approval. Which goal failed?", ch: [
      ["Confidentiality", false, "Confidentiality is about who can read data. Unauthorized changes break integrity."],
      ["Integrity", true, "Correct. Unauthorized change means data integrity was lost."],
      ["Availability", false, "Availability is about uptime. Altered files do not necessarily mean downtime."]] },
    boss: [
      { q: "A padlock on a server rack is which control type?", o: ["Physical", "Technical", "Managerial", "Operational"], a: 0 },
      { q: "Which key type is used to create digital signatures?", o: ["Symmetric", "Asymmetric private key", "Shared secret", "Salt"], a: 1 },
      { q: "A hash value mainly helps prove which goal?", o: ["Confidentiality", "Integrity", "Availability", "Accounting"], a: 1 }
    ] },
  { name: "Threats, Vulnerabilities & Attacks", s: "THREAT", w: 24, c: "#ff2bd6",
    nodes: [
      ["Threat actors", "Nation-states, organized crime, hacktivists, insiders, and script kiddies differ in skill, resources, and motivation."],
      ["Social engineering", "Phishing by email, vishing by phone, smishing by text, pretexting with invented stories, and tailgating into secured areas."],
      ["Credential attacks", "Brute force tries many passwords. Password spraying tries one common password across many accounts to avoid lockouts."],
      ["AI-era risks", "Prompt injection hides instructions in input to hijack a model. Data poisoning corrupts training data. Models can also leak sensitive data."]
    ],
    pairs: [["Phishing", "A lure, usually email, to steal credentials or deliver malware"], ["Password spraying", "One common password tried across many accounts"], ["Prompt injection", "Hidden instructions that hijack an AI model"], ["Tailgating", "Following an authorized person through a secured door"]],
    scen: { q: "Staff get an email: 'Reset your password now.' The link goes to a lookalike domain. What attack is this?", ch: [
      ["Phishing", true, "Correct. An email lure leading to a spoofed site is phishing."],
      ["Vishing", false, "Vishing uses voice calls, not email."],
      ["Rootkit", false, "A rootkit hides malware on a system. This is a credential-theft lure."]] },
    boss: [
      { q: "One common password is tried against 500 accounts. What attack is this?", o: ["Brute force", "Password spraying", "Pass-the-hash", "Replay"], a: 1 },
      { q: "A zero-day vulnerability is one that...", o: ["Was patched years ago", "Has no vendor fix yet", "Only affects insiders", "Only exists in old software"], a: 1 },
      { q: "Malware that hides itself from the OS to keep access is a...", o: ["Worm", "Rootkit", "Ransomware", "Adware"], a: 1 }
    ] },
  { name: "Security Architecture", s: "ARCH", w: 19, c: "#39ff14",
    nodes: [
      ["Cloud models", "IaaS gives you the OS and up. PaaS gives you the platform. SaaS gives you the finished app. The shared responsibility line moves with each."],
      ["Segmentation & DMZ", "Split networks into zones. Public-facing servers sit in a DMZ with tight firewall rules toward the internal network."],
      ["Zero trust", "Never trust by location. Verify identity and device on every request, and grant the least access needed."],
      ["Resilience", "The 3-2-1 backup rule: three copies, two media types, one offsite. RAID adds uptime but is not a backup."]
    ],
    pairs: [["IaaS", "You manage the OS and apps; the provider manages hardware"], ["SaaS", "The provider runs the complete application"], ["DMZ", "Buffer zone for public-facing servers"], ["3-2-1 rule", "3 copies, 2 media types, 1 offsite"]],
    scen: { q: "Your public web server must be reachable from the internet but must never touch the database directly. Where should it sit?", ch: [
      ["On the same flat LAN as the database", false, "A flat network lets an attacker move from the web server to the database."],
      ["In a DMZ with firewall rules to the app tier", true, "Correct. The DMZ isolates the public-facing server."],
      ["On the internet with admin access to the DB", false, "That exposes both the server and the database."]] },
    boss: [
      { q: "Which cloud model gives you the most control over the stack?", o: ["SaaS", "PaaS", "IaaS", "FaaS"], a: 2 },
      { q: "RAID 1 mainly protects against what?", o: ["Drive failure", "Ransomware", "Accidental deletion", "Malware"], a: 0 },
      { q: "Which zero trust principle is correct?", o: ["Trust the internal network", "Verify every request", "Trust VPN users", "Allow by default"], a: 1 }
    ] },
  { name: "Security Operations", s: "OPS", w: 27, c: "#ffe600",
    nodes: [
      ["Identity & access", "MFA combines two or more factor types. SSO reduces password sprawl. RBAC and least privilege limit what each account can do."],
      ["Monitoring", "A SIEM collects and correlates logs from many sources so alerts can be triaged and investigated."],
      ["Vulnerability management", "Identify, prioritize by risk, remediate, then validate the fix. Not every finding deserves the same urgency."],
      ["Incident response", "The cycle: preparation, detection, containment, recovery, lessons learned. Contain before you wipe so evidence survives."]
    ],
    pairs: [["MFA", "Two or more different types of authentication factors"], ["Least privilege", "Only the access the job actually needs"], ["SIEM", "Collects and correlates logs and alerts"], ["Containment", "Stop the spread before cleaning up"]],
    scen: { q: "At 2 a.m., EDR flags a workstation beaconing to an unknown IP. What is your first move?", ch: [
      ["Isolate the host from the network", true, "Correct. Containment first limits spread and keeps evidence."],
      ["Reimage it immediately", false, "Reimaging destroys the evidence you need for the investigation."],
      ["Ignore it; probably a backup job", false, "Assumptions like that are how breaches go unnoticed."]] },
    boss: [
      { q: "Which factor is a fingerprint?", o: ["Something you know", "Something you have", "Something you are", "Somewhere you are"], a: 2 },
      { q: "What is the main job of a SIEM?", o: ["Block malware", "Centralize and correlate logs", "Encrypt backups", "Patch systems"], a: 1 },
      { q: "Least privilege means...", o: ["Everyone is an admin", "Only the access required for the job", "Shared accounts", "Permissions never expire"], a: 1 }
    ] },
  { name: "Security Program Management", s: "GRC", w: 14, c: "#ff7a00",
    nodes: [
      ["Governance", "Policies state management intent. Standards are mandatory specifics. Procedures are step-by-step. Guidelines are recommendations."],
      ["Risk", "Risk management assesses likelihood and impact, keeps a risk register, and decides to accept, avoid, transfer, or mitigate."],
      ["Quantitative risk", "SLE is the cost of one loss. ARO is how often it happens per year. ALE = SLE × ARO, the expected annual loss."],
      ["Compliance & audits", "Regulations like GDPR, HIPAA, and PCI DSS set requirements. Audits test whether controls actually work."]
    ],
    pairs: [["Policy", "High-level management intent for security"], ["Standard", "A mandatory, specific requirement"], ["ALE", "SLE × ARO: expected loss per year"], ["PCI DSS", "Standard for protecting payment card data"]],
    scen: { q: "A flood could destroy the data center. SLE is $200,000 and ARO is 0.1 per year. What is the ALE?", ch: [
      ["$2,000,000", false, "That is SLE × 10, not SLE × 0.1."],
      ["$200,000", false, "That is one single loss. ALE multiplies by ARO."],
      ["$20,000", true, "Correct. $200,000 × 0.1 = $20,000 expected per year."]] },
    boss: [
      { q: "Accepting a risk means...", o: ["Ignoring it forever", "Living with it knowingly as is", "Transferring it to an insurer", "Removing the asset"], a: 1 },
      { q: "Which document type is mandatory and specific?", o: ["Policy", "Guideline", "Standard", "Vision statement"], a: 2 },
      { q: "Payment card data is governed by which standard?", o: ["HIPAA", "PCI DSS", "GDPR", "SOX"], a: 1 }
    ] }
];

const MISSIONS = [["learn", "01 LEARN", "4 intel nodes"], ["match", "02 MATCH", "pair the terms"], ["scenario", "03 SCENARIO", "SOC decision"], ["boss", "04 BOSS", "3 rapid questions"]];

let S = Object.assign({ xp: 0, done: {}, seen: {} }, safeLoad());
let V = { scr: "home", d: 0, i: 0, sel: null, matched: [], defOrder: [], wrong: 0, sc: null, bq: 0, bs: 0, ans: null };

function safeLoad() { try { return JSON.parse(localStorage.getItem("sec801neon")) || {}; } catch (e) { return {}; } }
function persist() { try { localStorage.setItem("sec801neon", JSON.stringify(S)); } catch (e) {} }
function gain(n) { S.xp += n; persist(); }
function finish(m, xp) {
  const k = V.d + "-" + m;
  if (!S.done[k]) { S.done[k] = true; if (xp) S.xp += xp; persist(); }
}
function domPct(d) { return MISSIONS.filter(m => S.done[d + "-" + m[0]]).length * 25; }
function rankName() {
  const x = S.xp;
  return x >= 1400 ? "Security+ Ready" : x >= 900 ? "Threat Hunter" : x >= 500 ? "SOC Analyst" : x >= 250 ? "Blue Team Recruit" : x >= 100 ? "Packet Sniffer" : "Script Kiddie";
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function markSeen() {
  S.seen[V.d + "-" + V.i] = true;
  if ([0, 1, 2, 3].every(i => S.seen[V.d + "-" + i])) finish("learn", 10);
  persist();
}
// Every interactive element gets a stable data-k key so focus survives re-renders.
function B(cls, k, act, label, extra) {
  return '<button class="' + cls + '" data-k="' + k + '" data-act="' + act + '"' + (extra || "") + '>' + label + '</button>';
}
const BACK = () => B("btn", "back", "back", "◀ back");

function viz(d) {
  if (d === 0) return '<svg class="viz" viewBox="0 0 200 170"><polygon class="pulse" points="100,18 182,152 18,152" fill="none" stroke="#00f0ff" stroke-width="2"/><circle cx="100" cy="18" r="14" fill="#000" stroke="#00f0ff"/><text x="100" y="23" text-anchor="middle" fill="#00f0ff" font-size="14">C</text><circle cx="18" cy="152" r="14" fill="#000" stroke="#00f0ff"/><text x="18" y="157" text-anchor="middle" fill="#00f0ff" font-size="14">I</text><circle cx="182" cy="152" r="14" fill="#000" stroke="#00f0ff"/><text x="182" y="157" text-anchor="middle" fill="#00f0ff" font-size="14">A</text><text x="100" y="110" text-anchor="middle" fill="#fff" font-size="11">THE CIA TRIAD</text></svg>';
  if (d === 1) {
    const labels = ["Recon", "Access", "Persist", "Exfil"];
    let g = "";
    labels.forEach((l, k) => {
      const x = 30 + k * 50;
      if (k < 3) g += '<line x1="' + (x + 14) + '" y1="60" x2="' + (x + 36) + '" y2="60" stroke="#ff2bd6" stroke-width="2" stroke-dasharray="3 3"/>';
      g += '<circle class="pulse" cx="' + x + '" cy="60" r="14" fill="#000" stroke="#ff2bd6" stroke-width="2"/><text x="' + x + '" y="100" text-anchor="middle" fill="#ff2bd6" font-size="10">' + l + '</text>';
    });
    return '<svg class="viz" viewBox="0 0 220 120">' + g + '<text x="110" y="25" text-anchor="middle" fill="#fff" font-size="11">ATTACK CHAIN</text></svg>';
  }
  if (d === 2) return '<svg class="viz" viewBox="0 0 200 170"><circle cx="100" cy="85" r="78" fill="none" stroke="#39ff14" stroke-opacity=".5"/><circle class="pulse" cx="100" cy="85" r="56" fill="none" stroke="#39ff14"/><circle cx="100" cy="85" r="34" fill="none" stroke="#39ff14"/><circle cx="100" cy="85" r="14" fill="none" stroke="#39ff14" stroke-width="3"/><text x="100" y="12" text-anchor="middle" fill="#39ff14" font-size="10">INTERNET</text><text x="100" y="40" text-anchor="middle" fill="#39ff14" font-size="10">DMZ</text><text x="100" y="66" text-anchor="middle" fill="#39ff14" font-size="10">INTERNAL</text><text x="100" y="89" text-anchor="middle" fill="#39ff14" font-size="9">DATA</text></svg>';
  if (d === 3) {
    const phases = ["Prep", "Detect", "Contain", "Recover", "Lessons"];
    let g = '<circle cx="100" cy="85" r="52" fill="none" stroke="#ffe600" stroke-opacity=".4" stroke-dasharray="6 5"/>';
    phases.forEach((p, k) => {
      const a = (-90 + k * 72) * Math.PI / 180;
      const x = 100 + 52 * Math.cos(a), y = 85 + 52 * Math.sin(a);
      const lx = 100 + 74 * Math.cos(a), ly = 85 + 74 * Math.sin(a) + 3;
      g += '<circle class="pulse" cx="' + x + '" cy="' + y + '" r="10" fill="#000" stroke="#ffe600" stroke-width="2"/><text x="' + lx + '" y="' + ly + '" text-anchor="middle" fill="#ffe600" font-size="10">' + p + '</text>';
    });
    return '<svg class="viz" viewBox="0 0 200 175">' + g + '<text x="100" y="89" text-anchor="middle" fill="#fff" font-size="10">IR CYCLE</text></svg>';
  }
  if (d === 4) {
    const rows = [["Policy", 150], ["Standard", 130], ["Procedure", 110], ["Guideline", 90]];
    let g = "";
    rows.forEach((r, k) => {
      const y = 12 + k * 36, w = r[1];
      g += '<rect class="pulse" x="' + (100 - w / 2) + '" y="' + y + '" width="' + w + '" height="28" fill="none" stroke="#ff7a00" stroke-width="2"/><text x="100" y="' + (y + 18) + '" text-anchor="middle" fill="#ff7a00" font-size="11">' + r[0] + '</text>';
    });
    return '<svg class="viz" viewBox="0 0 200 160">' + g + '</svg>';
  }
  return "";
}

function screens() {
  if (V.scr === "domain") return domain();
  if (V.scr === "learn") return learn();
  if (V.scr === "match") return match();
  if (V.scr === "scenario") return scenario();
  if (V.scr === "boss") return boss();
  return home();
}

function home() {
  // Pentagon of focusable buttons; positions in % of the map box.
  let lines = "", nodes = "";
  D.forEach((d, k) => {
    const a = (-90 + k * 72) * Math.PI / 180;
    const x = 50 + 36 * Math.cos(a), y = 52 + 37 * Math.sin(a);
    lines += '<line x1="50" y1="52" x2="' + x + '" y2="' + y + '" stroke="' + d.c + '" stroke-opacity=".45" stroke-width=".4" stroke-dasharray="1.5 2"/>';
    nodes += B("node", "dom" + k, "dom",
      '<b style="color:' + d.c + '">' + d.w + '%</b><span>' + d.s + '</span><em style="color:' + d.c + '">' + domPct(k) + '% done</em>',
      ' data-i="' + k + '"' + (k === V.d ? ' data-first' : '') + ' aria-label="' + d.name + ', ' + d.w + ' percent of exam, ' + domPct(k) + ' percent complete" style="left:' + x + '%;top:' + y + '%;border-color:' + d.c + '"');
  });
  return '<div class="hud"><span>OPERATOR // ' + rankName() + '</span><span>XP ' + S.xp + '</span></div>' +
    '<h1>SEC+ 801 // NEON DEFENSE</h1>' +
    '<div class="map"><svg viewBox="0 0 100 100" preserveAspectRatio="none">' + lines + '</svg>' +
    '<div class="core pulse" style="top:52%">SY0-801<small>V8 DOMAINS</small></div>' + nodes + '</div>' +
    '<p class="tiny" style="text-align:center;margin:2px 0 0">Swipe to pick a sector · pinch to enter</p>';
}

function domain() {
  const d = D[V.d];
  const tiles = MISSIONS.map((m, j) => B("tile", "m-" + m[0], "m",
    '<b>' + m[1] + (S.done[V.d + "-" + m[0]] ? " ✓" : "") + '</b><small>' + m[2] + '</small>',
    ' data-m="' + m[0] + '"' + (j === 0 ? " data-first" : "") + ' style="color:' + d.c + ';border-color:' + d.c + '"')).join("");
  return '<div class="hud">' + BACK() + '<span>' + d.w + '% of exam</span></div>' +
    '<h1 style="color:' + d.c + ';text-shadow:0 0 8px ' + d.c + '">' + d.name + '</h1>' +
    '<div class="bar"><i style="width:' + domPct(V.d) + '%"></i></div>' +
    '<p class="tiny">Complete all four missions to max out this sector.</p>' +
    '<div class="grid2" style="margin-top:12px">' + tiles + '</div>';
}

function learn() {
  const d = D[V.d];
  const n = d.nodes[V.i];
  const dots = [0, 1, 2, 3].map(i => '<span style="display:inline-block;width:12px;height:12px;margin:0 4px;border-radius:50%;border:2px solid ' + d.c + ';background:' + (i === V.i ? d.c : "transparent") + '"></span>').join("");
  return '<div class="hud">' + BACK() + '<span>intel ' + (V.i + 1) + '/4</span></div>' +
    '<div class="viz-wrap">' + viz(V.d) + '</div>' +
    '<div class="card" style="flex:1"><h2 style="color:' + d.c + '">' + n[0] + '</h2><p>' + n[1] + '</p></div>' +
    '<div class="row">' + B("btn", "prev", "ln", "◀ prev", ' data-dir="-1"') + '<div>' + dots + '</div>' + B("btn", "next", "ln", "next ▶", ' data-dir="1" data-first') + '</div>';
}

function match() {
  const d = D[V.d];
  const won = V.matched.length === 4;
  const terms = d.pairs.map((p, i) => {
    const ok = V.matched.includes(i);
    return B("cell " + (ok ? "good " : "") + (V.sel === i ? "sel" : ""), "t" + i, "mt", p[0], ' data-i="' + i + '"' + (ok ? " disabled" : " data-first") + (V.sel === i ? ' aria-pressed="true"' : ""));
  }).join("");
  const defs = V.defOrder.map((pi, j) => {
    const ok = V.matched.includes(pi);
    return B("cell " + (ok ? "good" : ""), "d" + j, "md", d.pairs[pi][1], ' data-j="' + j + '"' + (ok ? " disabled" : ""));
  }).join("");
  return '<div class="hud">' + BACK() + '<span>matched ' + V.matched.length + '/4 · miss ' + V.wrong + '</span></div>' +
    '<h2 style="color:' + d.c + ';margin-top:10px">' + (won ? "LINK ESTABLISHED · +20 XP" : (V.sel === null ? "Pick a term (left)" : "Now pick its definition (right)")) + '</h2>' +
    '<div class="grid2" style="margin-top:6px;grid-template-columns:2fr 3fr"><div>' + terms + '</div><div>' + defs + '</div></div>' +
    (won ? '<div class="row"><span></span>' + B("btn good", "done", "back", "Back to sector", " data-af") + '</div>' : "");
}

function scenario() {
  const d = D[V.d];
  const sc = d.scen;
  let body = "";
  if (V.sc === null) {
    body = sc.ch.map((c, j) => B("btn choice", "s" + j, "sa", c[0], ' data-j="' + j + '"' + (j === 0 ? " data-first" : ""))).join("");
  } else {
    const c = sc.ch[V.sc];
    body = '<div class="card" style="border-color:' + (c[1] ? "#39ff14" : "#ff2bd6") + '"><h2 style="color:' + (c[1] ? "#39ff14" : "#ff2bd6") + '">' + (c[1] ? "THREAT NEUTRALIZED" : "BREACH RISK") + '</h2><p>' + c[2] + '</p></div>' +
      '<div class="row"><span class="tiny">' + (c[1] ? "+20 XP" : "Run it again from the sector") + '</span>' + B("btn", "done", "back", "Back to sector", " data-af") + '</div>';
  }
  return '<div class="hud">' + BACK() + '<span>live incident</span></div>' +
    '<div class="card" style="border-color:' + d.c + '"><h2 style="color:' + d.c + '">SOC ALERT</h2><p>' + sc.q + '</p></div>' +
    '<div style="margin-top:12px">' + body + '</div>';
}

function boss() {
  const d = D[V.d];
  if (V.bq >= 3) {
    const pass = V.bs >= 2;
    if (pass) finish("boss", 10);
    return '<div class="hud">' + BACK() + '<span>boss result</span></div>' +
      '<div class="card" style="text-align:center;border-color:' + d.c + '"><h1 style="color:' + d.c + ';font-size:44px;margin:10px 0">' + V.bs + '/3</h1><h2>' + (pass ? "BOSS DOWN" : "BOSS SURVIVED") + '</h2><p>' + (pass ? "Sector hardened. Nice work." : "You need 2 of 3 to clear the boss.") + '</p></div>' +
      '<div class="row">' + (pass ? '<span></span>' : B("btn bad", "retry", "retry", "Retry", " data-af")) + B("btn", "done", "back", "Back to sector", pass ? " data-af" : "") + '</div>';
  }
  const q = d.boss[V.bq];
  const opts = q.o.map((o, j) => {
    let cls = "btn choice";
    if (V.ans !== null) { if (j === q.a) cls += " good"; else if (j === V.ans) cls += " bad"; }
    return B(cls, "b" + V.bq + "-" + j, "ba", o, ' data-j="' + j + '"' + (j === 0 ? " data-first" : "") + (V.ans !== null ? " disabled" : ""));
  }).join("");
  const fb = V.ans === null ? "" :
    '<div class="row"><span style="font-size:17px;color:' + (V.ans === q.a ? "#39ff14" : "#ff2bd6") + '">' + (V.ans === q.a ? "Hit. +5 XP" : "Miss. Correct answer in green.") + '</span>' +
    B("btn", "bn", "bn", (V.bq === 2 ? "Finish" : "Next") + " ▶", " data-af") + '</div>';
  return '<div class="hud">' + BACK() + '<span>boss ' + (V.bq + 1) + '/3 · hits ' + V.bs + '</span></div>' +
    '<div class="card" style="border-color:' + d.c + '"><h2 style="color:' + d.c + '">BOSS // ' + d.s + '</h2><p>' + q.q + '</p></div>' +
    '<div style="margin-top:10px">' + opts + '</div>' + fb;
}

/* ---------- navigation (browser history = glasses Back gesture) ---------- */
function setup(m) {
  V.sel = null;
  if (m === "learn") { V.i = 0; markSeen(); }
  if (m === "match") { V.matched = []; V.wrong = 0; V.defOrder = shuffle(D[V.d].pairs.map((_, i) => i)); }
  if (m === "scenario") { V.sc = null; }
  if (m === "boss") { V.bq = 0; V.bs = 0; V.ans = null; }
}
function go(scr, d) {
  V.scr = scr; if (d !== undefined) V.d = d;
  setup(scr);
  history.pushState({ scr: V.scr, d: V.d }, "");
  render(true);
}
function back() {
  if (history.state && history.state.scr !== "home") history.back();
  else if (V.scr !== "home") { V.scr = V.scr === "domain" ? "home" : "domain"; history.replaceState({ scr: V.scr, d: V.d }, ""); render(true); }
}
window.addEventListener("popstate", e => {
  const st = e.state || { scr: "home", d: 0 };
  V.scr = st.scr; V.d = st.d || 0;
  setup(V.scr);
  render(true);
});

function act(ds) {
  switch (ds.act) {
    case "back": back(); return;
    case "dom": go("domain", +ds.i); return;
    case "m": go(ds.m); return;
    case "retry": setup("boss"); break;
    case "ln": V.i = (V.i + (+ds.dir) + 4) % 4; markSeen(); break;
    case "mt": if (!V.matched.includes(+ds.i)) V.sel = +ds.i; break;
    case "md": {
      const pi = V.defOrder[+ds.j];
      if (V.sel === null || V.matched.includes(pi)) break;
      if (pi === V.sel) {
        V.matched.push(pi); gain(5); V.sel = null;
        if (V.matched.length === 4) finish("match", 20);
      } else { V.wrong++; V.sel = null; }
      break;
    }
    case "sa": {
      if (V.sc !== null) break;
      V.sc = +ds.j;
      finish("scenario", D[V.d].scen.ch[V.sc][1] ? 20 : 0);
      break;
    }
    case "ba": {
      if (V.ans !== null) break;
      V.ans = +ds.j;
      if (V.ans === D[V.d].boss[V.bq].a) { V.bs++; gain(5); }
      break;
    }
    case "bn": V.bq++; V.ans = null; break;
  }
  render(false);
}

function render(newScreen) {
  const app = document.getElementById("app");
  const prevKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  app.innerHTML = screens();
  // Keep the Neural Band "cursor" somewhere sensible after each re-render.
  const ok = el => el && !el.disabled;
  let t = app.querySelector("[data-af]");
  if (!ok(t) && !newScreen && prevKey) t = app.querySelector('[data-k="' + prevKey + '"]');
  if (!ok(t)) t = app.querySelector("[data-first]:not(:disabled)");
  if (!ok(t)) t = app.querySelector("button:not(:disabled)");
  if (t) t.focus({ preventScroll: true });
}

document.getElementById("app").addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (t && !t.disabled) act(Object.assign({}, t.dataset));
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); back(); }
});

history.replaceState({ scr: "home", d: 0 }, "");
render(true);
</script>
</body>
</html>
